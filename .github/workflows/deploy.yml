name: Deploy DebtManager PWA

on:
  push:
    branches: [ "claude/debt-budgeting-app-design-tdi2dz" ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: debt-manager/package-lock.json

      - name: Install dependencies
        working-directory: debt-manager
        run: npm install --legacy-peer-deps

      - name: Build web app
        working-directory: debt-manager
        run: npx expo export --platform web

      - name: Add PWA support files
        working-directory: debt-manager
        run: |
          cp pwa-assets/sw.js dist/
          cp pwa-assets/manifest.json dist/
          cp pwa-assets/icon-192.png dist/
          cp pwa-assets/icon-512.png dist/
          cp pwa-assets/apple-touch-icon.png dist/
          cp pwa-assets/favicon.ico dist/
          touch dist/.nojekyll

      - name: Patch index.html with SW registration and reload listener
        working-directory: debt-manager
        run: |
          python3 - <<'PYEOF'
          with open('dist/index.html', 'r') as f:
              html = f.read()
          sw_script = (
              "<script>"
              "if('serviceWorker' in navigator){"
              "navigator.serviceWorker.addEventListener('message',function(e){"
              "if(e.data&&e.data.type==='SW_UPDATED')window.location.reload(true);"
              "});"
              "navigator.serviceWorker.register('/fb-ad-creator1/sw.js',{scope:'/fb-ad-creator1/'}).catch(function(e){console.warn('SW reg failed',e)});"
              "}"
              "</script>"
          )
          pwa_meta = (
              '<link rel="manifest" href="/fb-ad-creator1/manifest.json">'
              '<link rel="apple-touch-icon" href="/fb-ad-creator1/apple-touch-icon.png">'
              '<meta name="apple-mobile-web-app-capable" content="yes">'
              '<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">'
              '<meta name="theme-color" content="#6C63FF">'
          )
          html = html.replace('</head>', pwa_meta + '</head>')
          html = html.replace('</body>', sw_script + '</body>')
          with open('dist/index.html', 'w') as f:
              f.write(html)
          print('Patched index.html with SW registration, reload listener, and PWA meta tags')
          PYEOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: debt-manager/dist
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'Deploy DebtManager PWA'
